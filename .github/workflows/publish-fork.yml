name: Publish Fork Gem
# Builds all platform gems from the publish-fork-fix branch, publishes them
# as GitHub Release assets at v1.6.0-rbi-fix, and prints nix SRI SHA256 hashes
# in the step summary so they can be copied into giza's rubyenv.nix.
#
# After a release build, copy the hashes from the job summary into:
#   giza/nix/ruby/rubyenv.nix → gemConfig.temporalio → platformGems
on:
  push:
    branches:
      - publish-fork-fix

permissions:
  contents: write

jobs:
  build-platform-gems:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rubyPlatform: aarch64-linux
          - rubyPlatform: aarch64-linux-musl
          - rubyPlatform: x86_64-linux
            gccVersion: "10"
          - rubyPlatform: x86_64-linux-musl
          - rubyPlatform: arm64-darwin
          - rubyPlatform: x86_64-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Read protoc version
        shell: bash
        run: echo "PROTOC_VERSION=$(tr -d '\n' < .protoc-version)" >> "$GITHUB_ENV"

      - name: Setup Ruby and Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: false
          cargo-cache: true
          cargo-vendor: true
          working-directory: ./temporalio
          cache-version: v1-${{ matrix.rubyPlatform }}

      - name: Build rb-sys-dock image
        id: build-rb-sys-dock-image
        working-directory: ./temporalio
        run: |
          gem install rb_sys --no-document
          rb_sys_version="$(ruby -e 'require "rb_sys/version"; puts RbSys::VERSION')"
          custom_image="temporalio-rbsys/${{ matrix.rubyPlatform }}:${rb_sys_version}-protoc-${PROTOC_VERSION}"
          docker build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE="rbsys/${{ matrix.rubyPlatform }}:${rb_sys_version}" \
            --build-arg GCC_VERSION="${{ matrix.gccVersion || '' }}" \
            --build-arg PROTOC_VERSION="${PROTOC_VERSION}" \
            -t "$custom_image" \
            -f ../.github/docker/rb-sys-protoc.Dockerfile \
            ..
          echo "image=$custom_image" >> "$GITHUB_OUTPUT"

      - name: Cross compile gem
        id: cross-gem
        working-directory: ./temporalio
        run: |
          RCD_IMAGE="${{ steps.build-rb-sys-dock-image.outputs.image }}" rb-sys-dock --platform "${{ matrix.rubyPlatform }}" --ruby-versions "3.3,3.4,4.0" --mount-toolchains --build
          echo "gem-path=$(find pkg -name '*-${{ matrix.rubyPlatform }}.gem')" >> "$GITHUB_OUTPUT"

      - name: Upload gem artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: ${{ matrix.rubyPlatform }}-gem
          path: ./temporalio/${{ steps.cross-gem.outputs.gem-path }}

  publish:
    needs: build-platform-gems
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all platform gems
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: gems
          merge-multiple: true

      - name: Publish GitHub Release and print nix hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.6.0-rbi-fix"

          # Delete any previous release so re-runs are idempotent
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true

          gh release create "$TAG" \
            --title "temporalio 1.6.0 — RBI block param fix" \
            --notes "Pre-built platform gems with \`def initialize(&block)\` fix in \`rbi/temporalio/workflow/future.rbi\`. Consume via \`gemConfig.temporalio\` in \`giza/nix/ruby/rubyenv.nix\`." \
            gems/*.gem

          # Print nix SRI hashes for each gem — copy these into rubyenv.nix
          echo "## Nix SRI hashes for \`rubyenv.nix\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Copy into \`gemConfig.temporalio → platformGems\` in \`giza/nix/ruby/rubyenv.nix\`:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| gem file | nix system | SRI hash |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|------------|----------|" >> "$GITHUB_STEP_SUMMARY"

          declare -A NIX_SYSTEM=(
            ["arm64-darwin"]="aarch64-darwin"
            ["x86_64-darwin"]="x86_64-darwin"
            ["x86_64-linux"]="x86_64-linux"
            ["aarch64-linux"]="aarch64-linux"
            ["x86_64-linux-musl"]="x86_64-linux-musl (unused by nix)"
            ["aarch64-linux-musl"]="aarch64-linux-musl (unused by nix)"
          )

          for gem in gems/*.gem; do
            filename="$(basename "$gem")"
            platform="${filename#temporalio-1.6.0-}"
            platform="${platform%.gem}"
            hash="sha256-$(openssl dgst -sha256 -binary "$gem" | base64 -w0)"
            nix_system="${NIX_SYSTEM[$platform]:-$platform}"
            echo "| \`$filename\` | \`$nix_system\` | \`$hash\` |" >> "$GITHUB_STEP_SUMMARY"
          done
